# Development Docker Setup - Con hot-reload

# Para usar este archivo, ejecuta:
# docker-compose -f docker-compose.dev.yml up

version: "3.8"

services:
  # MySQL database (PlanetScale local simulation)
  ps-mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: planetscale
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - "--max_connections=1000"
      - "--default-authentication-plugin=mysql_native_password"
    ports:
      - "3306:3306"
    volumes:
      - ps-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PlanetScale HTTP proxy
  planetscale-proxy:
    image: ghcr.io/mattrobenolt/ps-http-sim:latest
    command:
      - "-mysql-no-pass"
      - "-listen-port=3900"
      - "-mysql-dbname=planetscale"
      - "-mysql-addr=ps-mysql"
    depends_on:
      ps-mysql:
        condition: service_healthy
    ports:
      - "3900:3900"
    links:
      - ps-mysql

  # Email testing (Mailhog)
  mailhog:
    image: "mailhog/mailhog:latest"
    ports:
      - "1025:1025"
      - "8025:8025"

  # Prisma Studio for database inspection
  prisma-studio:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "mysql://root@ps-mysql:3306/planetscale"
    depends_on:
      ps-mysql:
        condition: service_healthy
    ports:
      - "5555:5555"
    command: pnpm --filter=@dub/prisma studio
    links:
      - ps-mysql

volumes:
  ps-mysql:
    driver: local

networks:
  default:
    name: dub-network-dev
    driver: bridge
