version: "3.8"

services:
  # MySQL database (PlanetScale local simulation)
  ps-mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: planetscale
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - "--max_connections=1000"
      - "--default-authentication-plugin=mysql_native_password"
    volumes:
      - ps-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PlanetScale HTTP proxy
  planetscale-proxy:
    image: ghcr.io/mattrobenolt/ps-http-sim:latest
    command:
      - "-mysql-no-pass"
      - "-listen-port=3900"
      - "-mysql-dbname=planetscale"
      - "-mysql-addr=ps-mysql"
    depends_on:
      ps-mysql:
        condition: service_healthy
    links:
      - ps-mysql

  # Email testing (Mailhog)
  mailhog:
    image: "mailhog/mailhog:latest"

  # Main Next.js web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Database connection (update with your actual values)
      DATABASE_URL: "mysql://root@ps-mysql:3306/planetscale"
      # Add your other environment variables here
      # NEXTAUTH_SECRET: your-secret
      # NEXTAUTH_URL: http://localhost:3000
    depends_on:
      ps-mysql:
        condition: service_healthy
      planetscale-proxy:
        condition: service_started
      mailhog:
        condition: service_started
    volumes:
      # Optional: for live reload during development
      # - .:/app
      # - /app/node_modules
    links:
      - ps-mysql
      - mailhog

volumes:
  ps-mysql:
    driver: local

networks:
  default:
    name: dub-network
    driver: bridge
